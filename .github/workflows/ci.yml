name: ci

# The gate every change passes before it reaches master. A push to master
# releases (see release.yml), so this has to be green on the pull request,
# not after the merge.

on:
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '.github/**'
      - '!.github/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'knip.json'
      - 'vitest.config.mjs'
      - '.dockerignore'
      - '.nvmrc'
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '.github/**'
      - '!.github/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'knip.json'
      - 'vitest.config.mjs'
      - '.dockerignore'
      - '.nvmrc'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A full install: the CLI tests drive a real pty, so node-pty must build.
      # No audit: npm's retiring audit endpoint can hang for minutes.
      - run: npm ci --no-audit

      - run: npm run check

      - run: npm test

      - run: npm run build

  image:
    name: relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image builds from a slice of the repo picked by the Dockerfile and
      # .dockerignore, so a layout change can break it while the job above
      # stays green. Build it here rather than finding out after the merge.
      - run: docker build -f packages/relay/Dockerfile .
