name: ci

# The gate every change passes before it reaches master. A push to master
# releases (see release.yml), so this has to be green on the pull request,
# not after the merge.

on:
  pull_request:
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'knip.json'
      - 'vitest.config.mjs'
      - 'scripts/bundle-release.mjs'
      - '.github/scripts/**'
      - '.dockerignore'
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'biome.json'
      - 'knip.json'
      - 'vitest.config.mjs'
      - 'scripts/bundle-release.mjs'
      - '.github/scripts/**'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A full install: the CLI tests drive a real pty, so node-pty must build.
      # No audit: npm's retiring audit endpoint can hang for minutes.
      - run: npm ci --no-audit

      - run: npm run check

      - run: npm test

      # The release ships bundles, not the workspaces' tsc output; build and
      # install them here so a bundling mistake fails the pull request, not
      # the release after the merge. Packing runs the full build.
      - name: Pack and verify the release tarballs
        run: |
          .github/scripts/pack-release.sh dist/release
          bash .github/scripts/verify-release.sh dist/release/herdr-remote.tgz

  image:
    name: relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image builds from a slice of the repo picked by the Dockerfile and
      # .dockerignore, so a layout change can break it while the job above
      # stays green. Build it here rather than finding out after the merge.
      # Both platforms: the image's last step runs the UPX-packed node, which
      # is the one part that can work on amd64 and still fail on arm64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
