name: release

# Releases herdr-remote: the CLI, the relay bundled inside it and the relay's
# container image, all under ONE version. The primary channel is a GitHub
# Release; npm is a backup. A GitHub Release is installable the moment it
# exists, whereas a fresh npm version can take many minutes to become
# installable, so updates would not be real-time if npm stayed the source of
# truth.
#
# What a run publishes, for version V:
#   - ONE GitHub Release, tagged `herdr-remote-vV`, marked latest, with
#       herdr-remote-V.tgz / herdr-remote.tgz       the CLI, relay bundled inside
#       herdr-remote-relay-V.tgz / herdr-remote-relay.tgz   the relay alone
#       latest.json                                 what clients read to find it
#   - herdr-remote@V on npm (backup; the relay is not published there on its
#     own any more, it rides inside the CLI)
#   - ghcr.io/<owner>/herdr-remote-relay:V (and `V.minor`, `latest`)
#
# The version is this workflow's *output*, not its input. Push a change that
# ships and the workflow bumps the patch component of the higher of the two
# package versions, writes it to both, releases, and commits it back to master
# with a `herdr-remote-vV` tag. Nobody edits a version field by hand, and
# nothing is released twice: the tag records what was last released, and the
# npm step still asks the registry before uploading.
#
# Only the newest commit on master releases. Runs queue (concurrency below), so
# by the time an older run starts, master has usually moved on; the `guard` job
# makes it stand down rather than ship code that is already superseded. Every
# master push runs the planner so a docs commit cannot strand a pending release.

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/bundle-release.mjs'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      release:
        description: 'auto releases only when something that ships changed; force always does'
        required: false
        default: auto
        type: choice
        options: [auto, force]
      bump:
        description: 'Which version component to increment'
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

# Two concurrent runs would compute the same next version and race to push the
# same commit. Queue them instead, and never cancel a run that may already have
# released. (GitHub keeps only the newest *pending* run in a group, which fits
# here; the guard covers the older run that was already waiting.)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides whether this run is still allowed to release. It runs when the run
  # actually starts, i.e. after any earlier release has finished and pushed.
  guard:
    name: check this is the newest commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.guard.outputs.release }}
      ref: ${{ steps.guard.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A run whose commit is no longer the tip of master is stale, and is
      # skipped (green, not failed). One exception: the release bookkeeping
      # commit (`Release … [skip ci]`) that the previous run pushed on top of
      # this commit is not newer *code*. Treating it as newer would leave this
      # commit never released, so the run releases from the tip instead, which
      # also carries the version bump this commit's checkout lacks.
      - name: Compare with origin/master
        id: guard
        run: |
          set -euo pipefail

          git fetch --no-tags origin master
          tip="$(git rev-parse FETCH_HEAD)"
          sha="${{ github.sha }}"

          release=false
          ref="$sha"
          if [ "$tip" = "$sha" ]; then
            release=true
          elif git merge-base --is-ancestor "$sha" "$tip"; then
            newer="$(git log --format=%s "$sha..$tip" | grep -Ev '^Release .+ \[skip ci\]$' || true)"
            if [ -z "$newer" ]; then
              release=true
              ref="$tip"
            else
              echo "master has moved on to ${tip:0:12} with newer changes; ${sha:0:12} is stale."
            fi
          else
            echo "${sha:0:12} is not on master (tip is ${tip:0:12}); not releasing."
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            if [ "$release" = true ]; then
              echo "Releasing from \`${ref:0:12}\`."
            else
              echo "Skipped: \`${sha:0:12}\` is no longer the newest commit on master."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: guard
    if: needs.guard.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push its tag, create the GitHub Release
    outputs:
      version: ${{ steps.version.outputs.version }}
      recorded: ${{ steps.record.outputs.recorded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}
          fetch-depth: 0 # release history lives in the tags
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Resume an interrupted publication
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resume-release.sh

      - name: Plan the release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ steps.resume.outputs.resume }}" = true ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/plan-release.sh "${{ inputs.release || 'auto' }}"
          fi

      # The bump happens *before* the install, and that order is deliberate.
      # `npm version` updates the workspace manifests and the root lockfile
      # together, so they never disagree — which is what `npm ci` refuses to
      # install. Run afterwards, against a populated node_modules, it re-resolves
      # the whole tree and rewrites far more of the lockfile than the version it
      # was asked to change. Both packages get the same version, counted on from
      # whichever is higher, so the first unified release continues the relay's
      # numbering. `--no-git-tag-version` leaves the commit and the tag to the
      # record step.
      - name: Bump the version
        if: steps.plan.outputs.release == 'true' && steps.resume.outputs.resume != 'true'
        run: |
          next="$(node -e '
            const bump = process.argv[1];
            const parse = (v) => v.split(".").map(Number);
            const [major, minor, patch] = ["cli", "relay"]
              .map((p) => parse(require(`./packages/${p}/package.json`).version))
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2])
              .pop();
            const next = bump === "major" ? [major + 1, 0, 0]
              : bump === "minor" ? [major, minor + 1, 0] : [major, minor, patch + 1];
            console.log(next.join("."));
          ' "${{ inputs.bump || 'patch' }}")"
          npm version "$next" --workspace=herdr-remote --workspace=herdr-remote-relay \
            --no-git-tag-version --allow-same-version

      - name: Sync herdr-plugin.toml version
        id: version
        if: steps.plan.outputs.release == 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const { version } = require("./packages/cli/package.json");
            const relay = require("./packages/relay/package.json").version;
            if (relay !== version) throw new Error(`relay ${relay} != cli ${version}`);
            const file = "packages/cli/herdr-plugin.toml";
            const toml = fs.readFileSync(file, "utf8");
            const updated = toml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`);
            if (updated === toml && !toml.includes(`version = "${version}"`)) {
              throw new Error(`Failed to update version in ${file}`);
            }
            fs.writeFileSync(file, updated);
          '
          echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      # Everything here is skipped when nothing that ships changed, so a docs or
      # workflow commit costs one cheap run instead of a release.
      - name: Install dependencies
        if: steps.plan.outputs.release == 'true'
        # A full install, unlike the image build: the CLI's test suite drives
        # a real pty, so the native node-pty module has to be compiled. No
        # audit: npm's retiring audit endpoint once held a release here for
        # five minutes.
        run: npm ci --no-audit

      # The same checks as ci.yml, so nothing is released that a pull request
      # would have rejected.
      - name: Check
        if: steps.plan.outputs.release == 'true'
        run: npm run check

      - name: Test
        if: steps.plan.outputs.release == 'true'
        run: npm test

      - name: Pack release assets
        if: steps.plan.outputs.release == 'true'
        run: .github/scripts/pack-release.sh dist/release

      - name: Verify installed release
        if: steps.plan.outputs.release == 'true'
        run: bash .github/scripts/verify-release.sh dist/release/herdr-remote.tgz

      # Written back before the release is published, so the tag the GitHub
      # Release points at already exists on the remote. `[skip ci]` is what
      # stops this push from starting the workflow again.
      - name: Record the release
        id: record
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_BASE: ${{ needs.guard.outputs.ref }}
          RESUME_RELEASE: ${{ steps.resume.outputs.resume }}
        run: bash .github/scripts/record-release.sh

      - name: Publish the GitHub Release
        if: steps.record.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/herdr-remote-relay"
          bash .github/scripts/publish-release.sh "${{ steps.version.outputs.version }}" "$image"

      # Backup channel, after the release is already live. The publish skips a
      # version npm has, and reports any failure as a warning (see the script):
      # npm being slow or down must not fail a release that users can already
      # install. Only the CLI goes to npm; the relay is bundled inside it.
      - name: Publish herdr-remote to npm (backup)
        if: steps.record.outputs.recorded == 'true'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: .github/scripts/publish-if-new.sh "dist/release/herdr-remote-${{ steps.version.outputs.version }}.tgz"

      - name: Summary
        if: steps.record.outputs.recorded == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo "### herdr-remote $version"
            echo
            echo "- GitHub Release: [herdr-remote-v$version](https://github.com/${{ github.repository }}/releases/tag/herdr-remote-v$version)"
            echo "- \`herdr-remote@$version\` with \`herdr-remote-relay@$version\` bundled"
            echo
            echo "npm backup publish is best-effort; see the npm step for warnings."
          } >> "$GITHUB_STEP_SUMMARY"

  # The relay image, from the commit the release was recorded on, so the image
  # carries the same version and the same code as the tarballs.
  image:
    name: relay image
    needs: release
    if: needs.release.outputs.recorded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: herdr-remote-v${{ needs.release.outputs.version }}

      # Lowercase the owner: GHCR rejects uppercase characters in image names,
      # while GitHub usernames may contain them.
      - name: Resolve image name and tags
        id: image
        run: |
          version="${{ needs.release.outputs.version }}"
          echo "name=ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/herdr-remote-relay" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false # keep the package listing to real image manifests
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.minor }}
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.title=herdr-remote-relay
            org.opencontainers.image.description=Standalone relay server for Herdr Remote
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Relay image published"
            echo
            echo "\`${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}\`"
            echo
            echo "- platforms: linux/amd64, linux/arm64"
            echo "- also tagged: \`${{ steps.image.outputs.minor }}\`, \`latest\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
