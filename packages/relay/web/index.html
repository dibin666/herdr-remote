<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- A square-cornered prompt on Herdr's own base colour: the favicon is the
         first thing this interface shows, so it is drawn to the same rules as
         everything after it. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%231e1e2e'/><rect x='1.5' y='1.5' width='21' height='21' fill='none' stroke='%2345475a'/><path d='M6 8l3.5 4L6 16' fill='none' stroke='%2389b4fa' stroke-width='2' stroke-linecap='square'/><path d='M12.5 16h5.5' stroke='%23a6e3a1' stroke-width='2' stroke-linecap='square'/></svg>" />
    <!-- `interactive-widget=resizes-content` makes the soft keyboard shrink the
         layout viewport on Android, matching what the visualViewport-driven
         --app-height does for iOS, so the key toolbar stays above it on both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#11111b" />
    <!-- `apple-mobile-web-app-capable` is the iOS spelling; the unprefixed name
         is the standard one every other engine reads, and Chrome warns when it
         is missing. Both are needed for a full-screen install. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mobile-first remote terminal WebUI for Herdr agent multiplexer" />
    <script>
      // Establish the dark-only shell before the module stylesheet mounts so
      // there is no light flash, regardless of OS or legacy stored settings.
      (() => {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.documentElement.style.colorScheme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#11111b');
      })();
    </script>
    <title>Herdr Remote WebUI</title>
  </head>
  <body class="bg-tui-crust text-tui-text font-mono antialiased overflow-hidden select-none m-0 p-0 h-[100dvh] w-screen">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
